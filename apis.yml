x-coverage:
  state: covered
  reason: covered
  detail: >-
    One genuinely institution-operated, machine-readable surface was found, probed and recorded:
    Tianjin University's own Shibboleth SAML 2.0 identity provider at idp.tju.edu.cn, serving
    14,410 bytes of credential-free metadata over HTTP 200, registered as eduGAIN entity 671640 in
    the CARSI federation since October 2019. That is the class this pipeline exists to find and it
    is the class the June 2026 cohort was most completely missing. It is institution-operated by
    every available signal — 202.113.2.198 in CERNET's BJR-CERNET block, the same address as the
    university's own web hosts, no CNAME, Shibboleth-specific protocol extensions, and the
    deployment's own 天津大学CARSI Idp branding.

    Three relationships are recorded rather than contracts: the CARSI/eduGAIN registration
    (federation), a Crossref membership with prefix 10.55582 (registry), and the ROR registration
    012tb2g32 (registry). None of their specifications is saved here and none of the relationships
    was deleted. The Crossref footprint is small and is stated as such — 11 DOIs, all backfile.

    What genuinely does not exist: no developer portal, no open data portal, no OpenAPI or any
    other specification published by the university, no OAuth or OIDC authorization server, no
    self-service registration, no published rate limits, no DataCite membership (providers and
    clients both return meta.total = 0), and no OpenID Connect alongside the SAML IdP. api.,
    data., open., developer., dev., hpc. and scc.tju.edu.cn do not resolve at all.

    What exists but cannot be read from outside China's campus network: the institutional
    repository ir.lib.tju.edu.cn, the OPAC opac.lib.tju.edu.cn and the portal portal.tju.edu.cn,
    all of which resolve into TJU's own address block and are transparently redirected to
    network-notice.tju.edu.cn, which serves a page titled "403" under HTTP 200. Four OAI-PMH paths
    were probed against the repository and all four hit that gate, so oai-pmh is recorded as not
    found from our vantage point rather than as absent. The library's reachable discovery front end
    at find.lib.tju.edu.cn answers every path with the same SPA shell and publishes no contract.

    Two corrections were made to the previous profile. The ProductPage pointer at
    opac.lib.tju.edu.cn was removed: it grades as a live HTTP 200 while actually returning the
    network gate's 403 notice. And a Chinese-language AI-governance document the graduate school
    issued — 《关于规范研究生学位论文与实践成果使用人工智能工具的倡议书》 — was located in search
    results but its published URL (gs.tju.edu.cn/info/1023/4816.htm) returns HTTP 404 over both
    HTTP and HTTPS while sibling pages on the same host return 200, so no AIPolicy pointer was
    emitted rather than emitting a dead one. Searches were run in Chinese as well as English.
