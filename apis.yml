aid: tianjin
name: Tianjin University
description: >-
  Tianjin University (天津大学, TJU) is a national public research university in Tianjin, China,
  founded in 1895 as Peiyang University and recognised as the oldest modern university in the
  country. It publishes no public API, no developer portal, no open data portal and no
  specification of any kind: www.tju.edu.cn returns 404 for robots.txt, llms.txt,
  .well-known/security.txt and .well-known/openid-configuration, and api., data., open.,
  developer. and dev.tju.edu.cn do not resolve. What it does operate — and this is the finding
  that separates it from most of this cohort — is its own Shibboleth SAML 2.0 identity provider at
  idp.tju.edu.cn, on the university's own CERNET address with no vendor CNAME, registered as
  entity 671640 in CARSI, China's national research-and-education identity federation, and visible
  in eduGAIN since October 2019. Its metadata document is credential-free, machine-readable and
  genuinely the institution's own engineering rather than a vendor's contract running under the
  university's name. Beyond that the estate is a set of relationships and gated systems: a
  Crossref membership with its own DOI prefix but only eleven registered DOIs, a ROR
  registration, a library discovery front end that answers only an SPA shell, and an institutional
  repository, OPAC and campus portal that resolve into TJU's own address block but redirect every
  off-campus request to a soft-403 network notice. There is no DataCite membership and no
  reachable OAI-PMH endpoint.
