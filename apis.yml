apis:
  - aid: tianjin:shibboleth-idp
    name: Tianjin University Shibboleth Identity Provider (SAML 2.0 metadata)
    description: >-
      The university's own Shibboleth identity provider, and the only credential-free,
      machine-readable contract anywhere in this profile. https://idp.tju.edu.cn/idp/shibboleth
      returns HTTP 200 and 14,410 bytes of SAML 2.0 metadata describing an IDPSSODescriptor and an
      AttributeAuthorityDescriptor, twelve X.509 certificates, and single sign-on, single logout,
      attribute query and artifact resolution endpoints across the Redirect, POST, POST-SimpleSign
      and SOAP bindings, plus the Shibboleth-specific urn:mace:shibboleth:1.0 AuthnRequest profile
      and shibmd:Scope extensions scoped to idp.tju.edu.cn. The deployment's own error pages are
      branded 天津大学CARSI Idp. Two honest caveats: the served document still carries Shibboleth's
      installer boilerplate ("This is example metadata only", mdui:DisplayName "A Name for the IdP
      at idp.tju.edu.cn"), which is a hygiene observation and not a reason to doubt the entity; and
      there is no OpenID Connect surface alongside it — /.well-known/openid-configuration and
      /idp/profile/oidc/keyset both return 404.
    humanURL: https://idp.tju.edu.cn/idp/
    baseURL: https://idp.tju.edu.cn/idp/
    tags:
      - Identity Federation
      - Shibboleth
      - SAML
      - Single Sign-On
      - Authentication
      - Education
    properties:
      - type: IdentityFederation
        url: identity-federation/tianjin-identity-federation.yml
      - type: Metadata
        url: identity-federation/tianjin-idp-saml-metadata.xml
      - type: Authentication
        url: authentication/tianjin-authentication.yml
      - type: Conformance
        url: conformance/tianjin-conformance.yml
    x-operator: institution
    x-operator-basis: >-
      idp.tju.edu.cn resolves to 202.113.2.198 — the same address as www.tju.edu.cn and
      en.tju.edu.cn — inside CERNET's BJR-CERNET allocation, with no CNAME to any vendor. Every
      endpoint in the metadata, including the :8443 back-channel services, is on that host.
      Shibboleth is open-source software the institution deploys itself, not a hosted platform, so
      there is no vendor tenancy here: the contract, the keys and the endpoints are Tianjin
      University's own.
  - aid: tianjin:carsi-edugain
    name: CARSI / eduGAIN Federation Registration (entity 671640)
    description: >-
      The same identity provider seen from the federation side. Tianjin University's IdP is
      registered in CARSI — the CERNET Authentication and Resource Sharing Infrastructure,
      registration authority https://www.carsi.edu.cn, an eduGAIN member federation since May 2019
      and in production since June 2019 — as eduGAIN entity 671640, first seen 2019-10-31, scope
      idp.tju.edu.cn, with both IDPSSODescriptor and AttributeAuthorityDescriptor roles and display
      names "Tianjin University" / 天津大学(Tianjin University). This is what makes the IdP usable
      for federated access to licensed library and publisher resources. Disambiguated against two
      same-city lookalikes registered in the same federation: idp.tjufe.edu.cn is Tianjin
      University of Finance and Economics and idp.tjut.edu.cn is Tianjin University of Technology;
      neither is recorded here.
    humanURL: https://www.carsi.edu.cn/
    baseURL: https://technical.edugain.org/api.php?action=list_entities&format=json&fed_id=CARSI
    tags:
      - Identity Federation
      - eduGAIN
      - CARSI
      - SAML
      - Registry
    properties:
      - type: IdentityFederation
        url: identity-federation/tianjin-identity-federation.yml
      - type: Registry
        url: https://technical.edugain.org/api.php?action=list_entities&format=json&fed_id=CARSI
      - type: Conformance
        url: conformance/tianjin-conformance.yml
    x-operator: federation
    x-operator-basis: >-
      An identity federation is shared by definition — 725 entities are registered in CARSI — and
      the entry within it carries Tianjin University's own IdP, scope, display names and roles.
      CERNET/CARSI operates the registry; the identity behind entity 671640 is the institution's.
      Per the university pipeline contract, the federation's own specification is not saved here
      and the relationship is not deleted for being shared.
  - aid: tianjin:crossref
    name: Crossref Membership (member 34483, prefix 10.55582)
    description: >-
      Tianjin University is a Crossref member in its own right — member id 34483, DOI prefix
      10.55582 — and is also present in the Crossref Open Funder Registry under funder ids
      501100004517 and 501100015644. The scale is worth stating plainly rather than rounding up:
      the member record reports 11 total DOIs, all backfile, none current. TJU registers no DOIs
      with DataCite; a query of both the DataCite providers and clients endpoints returns
      meta.total = 0.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/34483
    tags:
      - DOI
      - Persistent Identifiers
      - Scholarly Publishing
      - Registry
    properties:
      - type: Registry
        url: https://api.crossref.org/members/34483
      - type: Conformance
        url: conformance/tianjin-conformance.yml
    x-operator: registry
    x-operator-basis: >-
      An identifier registry the institution is registered in. api.crossref.org is shared because
      DOI registration is shared; member record 34483 and prefix 10.55582 name Tianjin University
      specifically. The registry's contract is Crossref's and is not saved here; the membership is
      a fact about the institution and is not deleted.
  - aid: tianjin:ror
    name: ROR Registration (https://ror.org/012tb2g32)
    description: >-
      Tianjin University's Research Organization Registry record — the canonical machine-readable
      identifier for the institution as an entity, and the join key the other registries in this
      profile resolve against. It carries the English and Chinese names, the alias Peiyang
      University, the acronym TJU, the domain tju.edu.cn, established 1895, GRID grid.33763.32,
      ISNI 0000 0004 1761 2484, Wikidata Q2031560, Crossref Funder ids 501100004517 and
      501100015644, and four child organisations (three State Key Laboratories and the
      Collaborative Innovation Center of Chemical Science and Engineering Tianjin).
    humanURL: https://ror.org/012tb2g32
    baseURL: https://api.ror.org/v2/organizations/012tb2g32
    tags:
      - Persistent Identifiers
      - Organization Identifiers
      - Registry
    properties:
      - type: Registry
        url: https://api.ror.org/v2/organizations/012tb2g32
    x-operator: registry
    x-operator-basis: >-
      An organisation registry the institution is registered in. ROR operates the API; the record
      describes Tianjin University.
  - aid: tianjin:library-discovery
    name: TJU Library Unified Discovery (统一检索)
    description: >-
      The library's unified discovery front end at find.lib.tju.edu.cn, reachable from outside the
      campus network and serving a real single-page application titled 统一检索. It publishes no
      machine-readable contract: /api/, /api/search and /search all return HTTP 200 with the same
      1,129-byte SPA shell rather than JSON, so there is nothing here that can be promoted to a
      contract. Recorded as an institution-operated surface with no institution-published
      interface. The library's main site is a separate host, home.lib.tju.edu.cn.
    humanURL: https://find.lib.tju.edu.cn/
    tags:
      - Library
      - Discovery
      - Catalog
      - Education
    properties:
      - type: LibraryCatalog
        url: https://find.lib.tju.edu.cn/
      - type: Website
        url: https://home.lib.tju.edu.cn/
    x-operator: institution
    x-operator-basis: >-
      find.lib.tju.edu.cn and home.lib.tju.edu.cn both resolve to 202.113.2.196, in the
      university's own CERNET block, with no CNAME to any discovery vendor and no vendor name,
      contact or account identifier exposed in the served HTML. The underlying discovery software
      may well be a purchased product, but nothing published states so, and there is no contract to
      attribute either way — so this is recorded as an institution-operated surface, not as a
      tenancy we cannot evidence.
  - aid: tianjin:campus-gated-systems
    name: Campus-Network-Gated Systems (repository, OPAC, portal)
    description: >-
      Three university systems resolve into TJU's own address block but are unreachable from
      outside the campus network: the institutional repository ir.lib.tju.edu.cn and the library
      OPAC opac.lib.tju.edu.cn (both 202.113.2.196) and the campus portal portal.tju.edu.cn
      (202.113.2.198). Every off-campus request to any of them is transparently redirected to
      http://network-notice.tju.edu.cn/, which serves a page titled "403" under HTTP status 200 —
      a soft-403 access control, not an outage. Four standard OAI-PMH paths were probed against
      the repository and all four hit the same gate. This is recorded as an institution-operated
      surface whose contract, if one exists, cannot be read from here; the previous profile's
      ProductPage pointer at opac.lib.tju.edu.cn has been removed because it grades as a live 200
      while returning a 403 notice.
    humanURL: https://home.lib.tju.edu.cn/
    tags:
      - Research Repository
      - Institutional Repository
      - Library
      - Restricted
      - Education
    properties:
      - type: Website
        url: https://home.lib.tju.edu.cn/
      - type: Authentication
        url: authentication/tianjin-authentication.yml
    x-operator: institution
    x-operator-basis: >-
      All three hosts sit in Tianjin University's own 202.113.2.0/24 CERNET allocation with no
      CNAME, and the interceptor itself, network-notice.tju.edu.cn, is a university host. The gate
      is the institution's own network policy.
