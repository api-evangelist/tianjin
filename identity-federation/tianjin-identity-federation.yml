hosting:
  host: idp.tju.edu.cn
  a_record: 202.113.2.198
  cname: none
  same_address_as:
  - www.tju.edu.cn
  - en.tju.edu.cn
  - portal.tju.edu.cn
  netname: BJR-CERNET
  network_operator: China Education and Research Network (CERNET)
  country: CN

x-operator: institution
x-operator-basis: >-
  The metadata endpoint, the SSO and SLO endpoints, the attribute authority and the signing
  certificates are all on idp.tju.edu.cn, which resolves to 202.113.2.198 — the same address as
  the university's own www and en sites, inside CERNET's BJR-CERNET allocation — with no CNAME to
  any vendor. The Shibboleth software is open source and not a hosted platform, so there is no
  vendor tenancy to record: the IdP is Tianjin University's own deployment on its own
  infrastructure. The CARSI/eduGAIN registration of that IdP is recorded separately with
  x-operator federation, because a federation is shared by definition while the identity behind
  it is the institution's.

caveats:
- >-
  The served metadata still carries the Shibboleth installer's own "This is example metadata
  only" banner and an unedited mdui:DisplayName reading "A Name for the IdP at idp.tju.edu.cn".
  That is a deployment-hygiene observation, not a reason to doubt the entity: the entityID,
  shibmd:Scope, endpoints and certificates are live, and the federation's own record carries the
  correct English and Chinese display names.
- >-
  No OpenID Connect surface exists alongside the SAML one. /idp/profile/oidc/keyset and
  /.well-known/openid-configuration both return 404 on idp.tju.edu.cn, and
  /.well-known/openid-configuration returns 404 on www.tju.edu.cn.
- >-
  /idp/status returns HTTP 403 by design — Shibboleth restricts that endpoint to configured
  hosts. It is recorded as a live, deliberately access-controlled endpoint, not as a dead one.
