specification: API Evangelist Identity Federation Record
specificationVersion: '0.1'
provider: Tianjin University
providerId: tianjin
generated: '2026-09-01'
method: probed
source: >-
  Live fetch of https://idp.tju.edu.cn/idp/shibboleth (HTTP 200, application/xml, 14,410 bytes,
  archived verbatim as identity-federation/tianjin-idp-saml-metadata.xml); the branded login and
  error surfaces at https://idp.tju.edu.cn/idp/profile/SAML2/Redirect/SSO (HTTP 400 "天津大学CARSI
  Idp - Stale Request") and https://idp.tju.edu.cn/idp/status (HTTP 403 "天津大学CARSI Idp - Access
  Denied"); the eduGAIN technical entity list for the CARSI federation
  (https://technical.edugain.org/api.php?action=list_entities&format=json&fed_id=CARSI, HTTP 200,
  602,799 bytes, 725 unique entities); the eduGAIN federation registry
  (https://technical.edugain.org/api.php?action=list_feds, 92 federations); and DNS/whois
  resolution of idp.tju.edu.cn.
description: >-
  Tianjin University operates its own Shibboleth SAML 2.0 identity provider and registers it in
  CARSI, China's national research-and-education identity federation, which has been an eduGAIN
  member since 2019. This is the institution's single strongest machine-readable, institution-
  operated surface: a signed, credential-free metadata document describing endpoints the
  university itself runs, on hardware in its own CERNET allocation, with no vendor host, CNAME or
  contact anywhere in the chain.

